<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Arena of the Immortals: a turn-based 3v3 strategy battle set in the world of Aethera. Early playable prototype." />
    <meta name="theme-color" content="#0c0e1a" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d9503f'/%3E%3Cpath d='M16 6l8 10-8 10-8-10z' fill='%23f6e7c4'/%3E%3C/svg%3E" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="AOI Arena" />
    <title>Arena of the Immortals</title>
    <style>
      /* The loading screen is plain HTML so it shows at once, before any of the game has arrived. */
      html, body { margin: 0; height: 100%; background: #0c0e1a; }
      #boot { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: #0c0e1a; color: #ece6d6; font-family: Georgia, 'Times New Roman', serif; text-align: center; padding: 20px; box-sizing: border-box; transition: opacity .35s; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .box { max-width: 520px; width: 100%; }
      #boot .seal { display: inline-block; width: 54px; height: 54px; line-height: 54px; border-radius: 10px; background: #d9503f; color: #f6e7c4; font-weight: 700; font-size: 18px; letter-spacing: 1px; }
      #boot h1 { font-size: 26px; font-weight: 400; margin: 14px 0 6px; }
      #boot p { margin: 6px 0; font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #a2a6c4; }
      #boot #boot-msg { color: #ece6d6; }
      #boot .bar { height: 6px; border-radius: 3px; background: #2c3357; overflow: hidden; margin: 14px auto 10px; max-width: 320px; }
      #boot .bar i { display: block; height: 100%; width: 4%; background: #e3b85c; border-radius: 3px; transition: width .3s; }
      #boot.failed .bar, #boot.failed #boot-tip { display: none; }
      #boot pre { display: none; text-align: left; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #f1a79c; background: #171c36; border: 1px solid #2c3357; border-radius: 6px; padding: 10px; margin: 12px 0; max-height: 32vh; overflow: auto; -webkit-user-select: text; user-select: text; }
      #boot .actions { display: none; gap: 10px; justify-content: center; }
      #boot button { font: 600 15px system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 10px 16px; border-radius: 6px; border: 1px solid #e3b85c; background: #e3b85c; color: #1b1407; }
      #boot button.quiet { background: none; color: #e3b85c; }
    </style>
    <script type="module" crossorigin src="./assets/index-cd_DzOZz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DJex3wTR.css">
  </head>
  <body>
    <div id="boot"><div class="box">
      <span class="seal">AOI</span>
      <h1>Arena of the Immortals</h1>
      <p id="boot-msg">Loading the game…</p>
      <div class="bar"><i id="boot-fill"></i></div>
      <p id="boot-tip">The first load can take a little while on mobile data.</p>
      <pre id="boot-detail"></pre>
      <div class="actions" id="boot-actions"><button onclick="location.reload()">Reload</button><button class="quiet" id="boot-copy">Copy details</button></div>
    </div></div>
    <div id="root"></div>
    <script>
      // Runs before the game itself, in the oldest dialect of JavaScript, so that a phone the game cannot run on still says why.
      (function () {
        var done = false, box = document.getElementById('boot');
        function el(id) { return document.getElementById(id); }
        function device() { return navigator.userAgent + '\n' + window.innerWidth + 'x' + window.innerHeight + ' @' + (window.devicePixelRatio || 1) + 'x'; }
        window.__bootFail = function (title, detail) {
          if (done || box.className === 'failed') return; // the first failure is the one worth reading
          if (/did not load|Failed to fetch|Load failed|NetworkError/i.test(String(detail))) title = 'A game file did not load';
          box.className = 'failed';
          el('boot-msg').textContent = title;
          el('boot-detail').textContent = (detail ? detail + '\n\n' : '') + device();
          el('boot-detail').style.display = 'block';
          el('boot-actions').style.display = 'flex';
        };
        window.__bootDone = function () { done = true; box.className = 'gone'; setTimeout(function () { box.style.display = 'none'; }, 450); };
        window.__bootProgress = function (fraction, text) { el('boot-fill').style.width = Math.max(4, Math.round(fraction * 100)) + '%'; if (text) el('boot-msg').textContent = text; };
        window.addEventListener('error', function (e) {
          if (done) return;
          if (e.target && e.target !== window && (e.target.src || e.target.href)) window.__bootFail('A game file did not load', 'Check your connection and reload.\n' + String(e.target.src || e.target.href).split('/').pop());
          else window.__bootFail('The game could not start on this device', (e.message || 'Script error') + (e.filename ? ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')' : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { if (!done) window.__bootFail('The game could not start on this device', String(e.reason && (e.reason.message || e.reason))); });
        el('boot-copy').onclick = function () {
          var t = el('boot-msg').textContent + '\n' + el('boot-detail').textContent;
          if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { el('boot-copy').textContent = 'Copied'; }, function () {});
          else { var r = document.createRange(); r.selectNodeContents(el('boot-detail')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
        };
        setTimeout(function () { if (!done && box.className !== 'failed') el('boot-tip').textContent = 'Still loading. On a slow connection this can take a minute. If nothing changes, reload the page.'; }, 25000);
        if (!window.WebGL2RenderingContext) window.__bootFail('This browser is too old for the game', 'It needs a browser version from 2021 or later.');
      })();
    </script>
  </body>
</html>
